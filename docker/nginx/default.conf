server {
    # 0.0.0.0 (não 127.0.0.1): o proxy do Coolify acessa o IP do container, não localhost
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.html;

    client_max_body_size 64M;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Laravel em /backend/public/ (equivalente ao .htaccess do backend)
    # Escritas em /api/v1 exigem Bearer token (auth:sanctum). Não exponha estas rotas sem TLS.
    location /backend/public {
        root /var/www/html;
        try_files $uri $uri/ /backend/public/index.php?$query_string;
    }

    location ~ ^/backend/public/index\.php(/|$) {
        root /var/www/html;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_hide_header X-Powered-By;
    }

    # Open Graph / preview rico (WhatsApp, Facebook, X, Telegram, LinkedIn) para páginas de competição
    location ~ ^/campeonatos/[^/]+(/inscricao)?/?$ {
        if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterest|SkypeUriPreview)") {
            rewrite ^ /backend/public/index.php last;
        }
        try_files $uri $uri/ /index.html;
    }

    # SPA na raiz — fallback para index.html (equivalente ao .htaccess de deploy/public)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
