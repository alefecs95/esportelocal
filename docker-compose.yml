services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /backend/public/api/v1
        VITE_MAIN_DOMAIN: ${VITE_MAIN_DOMAIN:-}
    expose:
      - "80"
    labels:
      # O painel do Coolify rejeita *.esportelocal.com. Estes labels roteiam
      # qualquer tenant (saofranciscoma.esportelocal.com, etc.) para o nginx.
      - traefik.http.services.semel-tenants.loadbalancer.server.port=80
      - traefik.http.routers.semel-tenants-https.rule=HostRegexp(`^(?:[a-z0-9-]+\.)?esportelocal\.com$$`)
      - traefik.http.routers.semel-tenants-https.entrypoints=https
      - traefik.http.routers.semel-tenants-https.tls=true
      - traefik.http.routers.semel-tenants-https.service=semel-tenants
      - traefik.http.routers.semel-tenants-http.rule=HostRegexp(`^(?:[a-z0-9-]+\.)?esportelocal\.com$$`)
      - traefik.http.routers.semel-tenants-http.entrypoints=http
      - traefik.http.routers.semel-tenants-http.middlewares=redirect-to-https
      - traefik.http.routers.semel-tenants-http.service=semel-tenants
      - caddy_semeltenants=http://*.esportelocal.com
      - caddy_semeltenants.reverse_proxy={{upstreams 80}}
    environment:
      # Diz ao Coolify para publicar este serviço (nginx) na porta 80.
      # No painel, domínio do serviço app: https://esportelocal.com:80
      SERVICE_FQDN_APP_80: ${SERVICE_FQDN_APP_80:-}
      APP_NAME: ${APP_NAME:-SEMEL}
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      APP_PUBLIC_PATH: /backend/public
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-semel}
      DB_USERNAME: ${DB_USERNAME:-semel}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
      CACHE_DRIVER: file
      FILESYSTEM_DISK: public
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      DIRECTD_API_URL: ${DIRECTD_API_URL:-}
      DIRECTD_API_TSE_URL: ${DIRECTD_API_TSE_URL:-}
      DIRECTD_API_TOKEN: ${DIRECTD_API_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@example.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_MEMORIA_DEMO: ${SEED_MEMORIA_DEMO:-true}
      IMPORT_DB_ON_START: ${IMPORT_DB_ON_START:-false}
      FORCE_IMPORT_DB: ${FORCE_IMPORT_DB:-false}
      IMPORT_DB_FILE: ${IMPORT_DB_FILE:-/opt/seed/backup.sql}
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-/opt/seed/public}
      IMPORT_STORAGE_FILE: ${IMPORT_STORAGE_FILE:-}
      FORCE_IMPORT_STORAGE: ${FORCE_IMPORT_STORAGE:-false}
      RUN_CONFIG_CACHE: ${RUN_CONFIG_CACHE:-true}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-http://whatsapp:3000}
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN:-semel-internal-whatsapp}
    volumes:
      - app_storage:/var/www/html/backend/storage
      - db_import:/docker/database/import
    depends_on:
      mysql:
        condition: service_healthy
      whatsapp:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
      MYSQL_DATABASE: ${DB_DATABASE:-semel}
      MYSQL_USER: ${DB_USERNAME:-semel}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  whatsapp:
    build:
      context: ./whatsapp-gateway
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      PORT: "3000"
      AUTH_DIR: /data/sessions
      GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN:-semel-internal-whatsapp}
      LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-info}
    volumes:
      - whatsapp_sessions:/data/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  mysql_init:
  db_import:
  whatsapp_sessions:
