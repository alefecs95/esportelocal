services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /backend/public/api/v1
        VITE_MAIN_DOMAIN: ${VITE_MAIN_DOMAIN:-}
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - traefik.docker.network=coolify
    environment:
      # Coolify: registra domínio e roteia HTTPS (porta 80) para este serviço
      SERVICE_URL_APP_80: /
      APP_NAME: ${APP_NAME:-SEMEL}
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_PUBLIC_PATH: /backend/public
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-semel}
      DB_USERNAME: ${DB_USERNAME:-semel}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
      CACHE_DRIVER: file
      FILESYSTEM_DISK: public
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      DIRECTD_API_URL: ${DIRECTD_API_URL:-}
      DIRECTD_API_TSE_URL: ${DIRECTD_API_TSE_URL:-}
      DIRECTD_API_TOKEN: ${DIRECTD_API_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@example.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      IMPORT_DB_ON_START: ${IMPORT_DB_ON_START:-false}
      IMPORT_DB_FILE: ${IMPORT_DB_FILE:-/docker/database/import/backup.sql}
      RUN_CONFIG_CACHE: ${RUN_CONFIG_CACHE:-true}
    volumes:
      - app_storage:/var/www/html/backend/storage
      - db_import:/docker/database/import
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
      MYSQL_DATABASE: ${DB_DATABASE:-semel}
      MYSQL_USER: ${DB_USERNAME:-semel}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  mysql_init:
  db_import:

networks:
  coolify:
    external: true
    name: coolify
